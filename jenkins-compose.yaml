
services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: employee-jenkins
    user: root
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    command: >
      bash -c "
      apt-get update &&
      apt-get install -y wget unzip &&
      wget -q https://releases.hashicorp.com/terraform/1.14.0/terraform_1.14.0_linux_amd64.zip -O /tmp/terraform.zip &&
      unzip -o /tmp/terraform.zip -d /usr/local/bin &&
      chmod +x /usr/local/bin/terraform &&
      exec /usr/bin/tini -- /usr/local/bin/jenkins.sh
      "

volumes:
  jenkins_home:
